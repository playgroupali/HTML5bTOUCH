<!DOCTYPE html>
<html lang="en">
<head>
	<title>HTML5bTOUCH - Battle for Dream Island</title>
	<meta name="description" content="An HTML5 port of the puzzle platformer in the world of Battle for Dream Island."/>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<meta name="author" content="coppersalts">
	<meta property="og:title" content="HTML5b">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://github.io">
	<meta property="og:image" content="https://github.iovisuals/bg/bg0002.png">
	<meta property="og:description" content="An HTML5 port of Cary Huang's BFDIA 5b.">
	<meta name="theme-color" content="#c92b20">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="shortcut icon" type="image/x-icon" href="./visuals/blocks/b0001.svg" />
	<link rel="stylesheet" href="style.css" type="text/css"/>

	<!-- Capture 5b.js keyboard listeners directly before 5b.js loads -->
	<script>
		window._capturedKeyListeners = { keydown: [], keyup: [] };
		const origAddEventListener = EventTarget.prototype.addEventListener;
		EventTarget.prototype.addEventListener = function(type, listener, options) {
			if ((type === 'keydown' || type === 'keyup') && typeof listener === 'function') {
				window._capturedKeyListeners[type].push({ target: this, fn: listener });
			}
			return origAddEventListener.call(this, type, listener, options);
		};
	</script>

	<script type="text/javascript" src="5b.js"></script>
	<style>
		html, body, #cnv {
			touch-action: manipulation !important;
			user-select: none !important;
			-webkit-user-select: none !important;
		}

		#touch-controls {
			position: fixed;
			bottom: 16px;
			left: 16px;
			right: 16px;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
			pointer-events: none;
			z-index: 999999;
		}

		.control-group {
			display: flex;
			gap: 12px;
			pointer-events: auto;
		}

		.action-column {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 10px;
			pointer-events: auto;
		}

		.top-actions {
			display: flex;
			gap: 10px;
		}

		.ctrl-btn {
			background: rgba(25, 25, 25, 0.72);
			color: #ffffff;
			border: 2px solid rgba(255, 255, 255, 0.85);
			border-radius: 12px;
			font-family: sans-serif;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			touch-action: none;
			cursor: pointer;
		}

		.ctrl-btn.pressed {
			background: rgba(255, 255, 255, 0.45);
			transform: scale(0.94);
		}

		.arrow-btn { width: 66px; height: 66px; font-size: 28px; }
		.small-btn { width: 52px; height: 46px; font-size: 18px; }
		.enter-btn { width: 74px; height: 46px; font-size: 15px; }
		.space-btn { width: 114px; height: 62px; font-size: 18px; }
	</style>
</head>
<body style="overflow:hidden;">
<div id="center">
	<div id="hide-contenteditable"><canvas width="960" height="540" id="cnv" tabindex="0" contenteditable="false"></canvas></div>
	<p class="bottomtext">An HTML5 port of Cary Huang's <a href="https://bfdi.tv">BFDIA 5b</a>. Explore is powered by <a href="https://zelo.dev">Zelo101's 5beam</a>.</p>
</div>

<div id="touch-controls">
	<div class="control-group">
		<div id="btn-left" class="ctrl-btn arrow-btn">&lt;</div>
		<div id="btn-right" class="ctrl-btn arrow-btn">&gt;</div>
	</div>

	<div class="action-column">
		<div class="top-actions">
			<div id="btn-enter" class="ctrl-btn enter-btn">ENTER</div>
			<div id="btn-r" class="ctrl-btn small-btn">R</div>
			<div id="btn-z" class="ctrl-btn small-btn">Z</div>
		</div>
		<div id="btn-space" class="ctrl-btn space-btn">SPACE</div>
	</div>
</div>

<script>
	const canvas = document.getElementById('cnv');

	// 1. Trigger captured listeners directly + dispatch standard events
	function triggerKey(keyCode, key, code, type) {
		const fakeEvent = {
			type: type,
			key: key,
			code: code,
			keyCode: keyCode,
			which: keyCode,
			charCode: keyCode,
			repeat: false,
			shiftKey: false,
			ctrlKey: false,
			altKey: false,
			metaKey: false,
			target: canvas || document.body,
			currentTarget: window,
			preventDefault: () => {},
			stopPropagation: () => {}
		};

		const listeners = window._capturedKeyListeners[type] || [];
		for (const item of listeners) {
			try {
				item.fn.call(item.target, fakeEvent);
			} catch (err) {}
		}

		const nativeEvent = new KeyboardEvent(type, {
			key: key,
			code: code,
			keyCode: keyCode,
			which: keyCode,
			bubbles: true,
			cancelable: true
		});
		Object.defineProperty(nativeEvent, 'keyCode', { get: () => keyCode });
		Object.defineProperty(nativeEvent, 'which', { get: () => keyCode });
		window.dispatchEvent(nativeEvent);
		document.dispatchEvent(nativeEvent);
	}

	// 2. Bind on-screen buttons
	function bindButton(id, keyCode, key, code) {
		const btn = document.getElementById(id);

		const press = (e) => {
			e.preventDefault();
			e.stopPropagation();
			btn.classList.add('pressed');
			triggerKey(keyCode, key, code, 'keydown');
		};

		const release = (e) => {
			e.preventDefault();
			e.stopPropagation();
			btn.classList.remove('pressed');
			triggerKey(keyCode, key, code, 'keyup');
		};

		btn.addEventListener('touchstart', press, { passive: false });
		btn.addEventListener('touchend', release, { passive: false });
		btn.addEventListener('touchcancel', release, { passive: false });
		btn.addEventListener('mousedown', press);
		btn.addEventListener('mouseup', release);
	}

	bindButton('btn-left', 37, 'ArrowLeft', 'ArrowLeft');
	bindButton('btn-right', 39, 'ArrowRight', 'ArrowRight');
	bindButton('btn-enter', 13, 'Enter', 'Enter');
	bindButton('btn-r', 82, 'r', 'KeyR');
	bindButton('btn-z', 90, 'z', 'KeyZ');
	bindButton('btn-space', 32, ' ', 'Space');

	// 3. Translate canvas taps into Left Clicks (button: 0)
	canvas.addEventListener('touchstart', (e) => {
		e.preventDefault();
		const touch = e.changedTouches[0];
		canvas.dispatchEvent(new MouseEvent('mousemove', {
			bubbles: true, view: window, clientX: touch.clientX, clientY: touch.clientY
		}));
		canvas.dispatchEvent(new MouseEvent('mousedown', {
			bubbles: true, cancelable: true, view: window, button: 0, buttons: 1,
			clientX: touch.clientX, clientY: touch.clientY
		}));
	}, { passive: false });

	canvas.addEventListener('touchend', (e) => {
		e.preventDefault();
		const touch = e.changedTouches[0];
		canvas.dispatchEvent(new MouseEvent('mouseup', {
			bubbles: true, cancelable: true, view: window, button: 0, buttons: 0,
			clientX: touch.clientX, clientY: touch.clientY
		}));
		canvas.dispatchEvent(new MouseEvent('click', {
			bubbles: true, cancelable: true, view: window, button: 0,
			clientX: touch.clientX, clientY: touch.clientY
		}));
	}, { passive: false });

	// 4. Block pinch-to-zoom without interfering with taps
	document.addEventListener('gesturestart', (e) => {
		e.preventDefault();
	});
</script>
</body>
</html>
