<!DOCTYPE html>
<html lang="en">
<head>
	<title>TOUCH5B - Battle for Dream Island</title>
	<meta name="description" content="An HTML5 port of the puzzle platformer in the world of Battle for Dream Island."/>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<meta name="author" content="coppersalts">
	<meta property="og:title" content="HTML5b">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://github.io">
	<meta property="og:image" content="https://github.iovisuals/bg/bg0002.png">
	<meta property="og:description" content="An HTML5 port of Cary Huang's BFDIA 5b.">
	<meta name="theme-color" content="#c92b20">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="shortcut icon" type="image/x-icon" href="./visuals/blocks/b0001.svg" />
	<link rel="stylesheet" href="style.css" type="text/css"/>

	<!-- Capture 5b.js keyboard listeners directly before 5b.js loads -->
	<script>
		window._capturedKeyListeners = { keydown: [], keypress: [], keyup: [] };
		const origAddEventListener = EventTarget.prototype.addEventListener;
		EventTarget.prototype.addEventListener = function(type, listener, options) {
			if ((type === 'keydown' || type === 'keypress' || type === 'keyup') && typeof listener === 'function') {
				window._capturedKeyListeners[type].push({ target: this, fn: listener });
			}
			return origAddEventListener.call(this, type, listener, options);
		};
	</script>

	<script type="text/javascript" src="5b.js"></script>
	<style>
		html, body, #cnv {
			touch-action: manipulation !important;
			user-select: none !important;
			-webkit-user-select: none !important;
		}

		#touch-controls {
			position: fixed;
			bottom: 16px;
			left: 16px;
			right: 16px;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
			pointer-events: none;
			z-index: 999999;
		}

		.control-group {
			display: flex;
			gap: 12px;
			pointer-events: auto;
		}

		.action-column {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 10px;
			pointer-events: auto;
		}

		.top-actions {
			display: flex;
			gap: 10px;
		}

		.ctrl-btn {
			background: rgba(25, 25, 25, 0.72);
			color: #ffffff;
			border: 2px solid rgba(255, 255, 255, 0.85);
			border-radius: 12px;
			font-family: sans-serif;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			touch-action: none;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
		}

		.ctrl-btn.pressed {
			background: rgba(255, 255, 255, 0.55);
			transform: scale(0.94);
		}

		.arrow-btn { width: 66px; height: 66px; font-size: 28px; }
		.small-btn { width: 52px; height: 46px; font-size: 18px; }
		.enter-btn { width: 74px; height: 46px; font-size: 15px; }
		.space-btn { width: 114px; height: 62px; font-size: 18px; }
	</style>
</head>
<body style="overflow:hidden;">
<div id="center">
	<div id="hide-contenteditable"><canvas width="960" height="540" id="cnv" tabindex="0" contenteditable="false"></canvas></div>
	<p class="bottomtext">An HTML5 port of Cary Huang's <a href="https://bfdi.tv">BFDIA 5b</a>. Explore is powered by <a href="https://zelo.dev">Zelo101's 5beam</a>.</p>
</div>

<div id="touch-controls">
	<div class="control-group">
		<button type="button" id="btn-left" class="ctrl-btn arrow-btn"
			ontouchstart="btnDown(event, this, 37, 'ArrowLeft', 'ArrowLeft')"
			ontouchend="btnUp(event, this, 37, 'ArrowLeft', 'ArrowLeft')"
			ontouchcancel="btnUp(event, this, 37, 'ArrowLeft', 'ArrowLeft')"
			onmousedown="btnDown(event, this, 37, 'ArrowLeft', 'ArrowLeft')"
			onmouseup="btnUp(event, this, 37, 'ArrowLeft', 'ArrowLeft')">&lt;</button>
		<button type="button" id="btn-right" class="ctrl-btn arrow-btn"
			ontouchstart="btnDown(event, this, 39, 'ArrowRight', 'ArrowRight')"
			ontouchend="btnUp(event, this, 39, 'ArrowRight', 'ArrowRight')"
			ontouchcancel="btnUp(event, this, 39, 'ArrowRight', 'ArrowRight')"
			onmousedown="btnDown(event, this, 39, 'ArrowRight', 'ArrowRight')"
			onmouseup="btnUp(event, this, 39, 'ArrowRight', 'ArrowRight')">&gt;</button>
	</div>

	<div class="action-column">
		<div class="top-actions">
			<button type="button" id="btn-enter" class="ctrl-btn enter-btn"
				ontouchstart="btnDown(event, this, 13, 'Enter', 'Enter')"
				ontouchend="btnUp(event, this, 13, 'Enter', 'Enter')"
				ontouchcancel="btnUp(event, this, 13, 'Enter', 'Enter')"
				onmousedown="btnDown(event, this, 13, 'Enter', 'Enter')"
				onmouseup="btnUp(event, this, 13, 'Enter', 'Enter')">ENTER</button>
			<button type="button" id="btn-r" class="ctrl-btn small-btn"
				ontouchstart="btnDown(event, this, 82, 'r', 'KeyR')"
				ontouchend="btnUp(event, this, 82, 'r', 'KeyR')"
				ontouchcancel="btnUp(event, this, 82, 'r', 'KeyR')"
				onmousedown="btnDown(event, this, 82, 'r', 'KeyR')"
				onmouseup="btnUp(event, this, 82, 'r', 'KeyR')">R</button>
			<button type="button" id="btn-z" class="ctrl-btn small-btn"
				ontouchstart="btnDown(event, this, 90, 'z', 'KeyZ')"
				ontouchend="btnUp(event, this, 90, 'z', 'KeyZ')"
				ontouchcancel="btnUp(event, this, 90, 'z', 'KeyZ')"
				onmousedown="btnDown(event, this, 90, 'z', 'KeyZ')"
				onmouseup="btnUp(event, this, 90, 'z', 'KeyZ')">Z</button>
		</div>
		<button type="button" id="btn-space" class="ctrl-btn space-btn"
			ontouchstart="btnDown(event, this, 32, ' ', 'Space')"
			ontouchend="btnUp(event, this, 32, ' ', 'Space')"
			ontouchcancel="btnUp(event, this, 32, ' ', 'Space')"
			onmousedown="btnDown(event, this, 32, ' ', 'Space')"
			onmouseup="btnUp(event, this, 32, ' ', 'Space')">SPACE</button>
	</div>
</div>

<script>
	const canvas = document.getElementById('cnv');

	function fireKey(keyCode, key, code, type) {
		const fakeEvent = {
			type: type,
			key: key,
			code: code,
			keyCode: keyCode,
			which: keyCode,
			charCode: keyCode,
			repeat: false,
			shiftKey: false,
			ctrlKey: false,
			altKey: false,
			metaKey: false,
			target: canvas || document.body,
			currentTarget: window,
			preventDefault: function() {},
			stopPropagation: function() {}
		};

		const listeners = (window._capturedKeyListeners && window._capturedKeyListeners[type]) || [];
		for (let i = 0; i < listeners.length; i++) {
			try {
				listeners.item ? listeners.item(i) : listeners[i].fn.call(listeners[i].target, fakeEvent);
			} catch (err) {}
		}

		const targets = [window, document, document.body, canvas];
		for (let t = 0; t < targets.length; t++) {
			const target = targets[t];
			if (!target) continue;

			const nativeEvent = new KeyboardEvent(type, {
				key: key,
				code: code,
				keyCode: keyCode,
				which: keyCode,
				bubbles: true,
				cancelable: true
			});
			Object.defineProperty(nativeEvent, 'keyCode', { get: function() { return keyCode; } });
			Object.defineProperty(nativeEvent, 'which', { get: function() { return keyCode; } });
			target.dispatchEvent(nativeEvent);

			if (typeof target['on' + type] === 'function') {
				try { target['on' + type](fakeEvent); } catch (err) {}
			}
		}
	}

	function btnDown(e, el, keyCode, key, code) {
		e.preventDefault();
		e.stopPropagation();
		el.classList.add('pressed');
		fireKey(keyCode, key, code, 'keydown');
		fireKey(keyCode, key, code, 'keypress');
	}

	function btnUp(e, el, keyCode, key, code) {
		e.preventDefault();
		e.stopPropagation();
		el.classList.remove('pressed');
		fireKey(keyCode, key, code, 'keyup');
	}

	// Translate canvas taps into Left Clicks (button: 0)
	canvas.addEventListener('touchstart', function(e) {
		e.preventDefault();
		const touch = e.changedTouches.item(0);
		if (!touch) return;
		canvas.dispatchEvent(new MouseEvent('mousemove', {
			bubbles: true, view: window, clientX: touch.clientX, clientY: touch.clientY
		}));
		canvas.dispatchEvent(new MouseEvent('mousedown', {
			bubbles: true, cancelable: true, view: window, button: 0, buttons: 1,
			clientX: touch.clientX, clientY: touch.clientY
		}));
	}, { passive: false });

	canvas.addEventListener('touchend', function(e) {
		e.preventDefault();
		const touch = e.changedTouches.item(0);
		if (!touch) return;
		canvas.dispatchEvent(new MouseEvent('mouseup', {
			bubbles: true, cancelable: true, view: window, button: 0, buttons: 0,
			clientX: touch.clientX, clientY: touch.clientY
		}));
		canvas.dispatchEvent(new MouseEvent('click', {
			bubbles: true, cancelable: true, view: window, button: 0,
			clientX: touch.clientX, clientY: touch.clientY
		}));
	}, { passive: false });

	document.addEventListener('gesturestart', function(e) {
		e.preventDefault();
	});
</script>
</body>
</html>
